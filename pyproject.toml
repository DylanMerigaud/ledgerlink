[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ledgerlink"
dynamic = ["version"]
description = "One envelope over many heterogeneous JSON Lines ledgers, a <store>:<key> ref grammar you extend, an offset-tailing sqlite cache and a read-only walk over the refs. Stdlib only, no network."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan Merigaud" }]
keywords = ["jsonl", "ledger", "append-only", "sqlite", "cache", "refs", "graph", "audit-log"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DylanMerigaud/ledgerlink"
Source = "https://github.com/DylanMerigaud/ledgerlink"
Issues = "https://github.com/DylanMerigaud/ledgerlink/issues"
Changelog = "https://github.com/DylanMerigaud/ledgerlink/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff", "mypy", "build"]

[tool.hatch.version]
path = "ledgerlink/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ledgerlink"]

[tool.hatch.build.targets.sdist]
include = ["/ledgerlink", "/tests", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/ruff.toml"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
